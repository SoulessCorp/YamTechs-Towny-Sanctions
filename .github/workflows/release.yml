name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed so we can look at previous tags/releases

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version from pom.xml: $VERSION"

      - name: Check for an existing release
        id: release_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          TAG="v${CURRENT}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; creating a snapshot"
            echo "is_new_version=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist; creating a clean release"
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine JAR name and tag
        id: naming
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_NEW="${{ steps.release_status.outputs.is_new_version }}"

          if [ "$IS_NEW" = "true" ]; then
            # Clean release for a new version
            JAR_NAME="Sanctions-${VERSION}.jar"
            TAG="v${VERSION}"
            RELEASE_NAME="Sanctions ${VERSION}"
            PRERELEASE=false

            # Mark as prerelease if version contains -pre, -SNAPSHOT, etc.
            if [[ "$VERSION" == *"-pre"* ]] || [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ "$VERSION" == *"RC"* ]]; then
              PRERELEASE=true
            fi
          else
            # Snapshot of an existing version
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            JAR_NAME="Sanctions-${VERSION}-snapshot-${TIMESTAMP}-${RUN_SUFFIX}.jar"
            TAG="v${VERSION}-snapshot-${TIMESTAMP}-${RUN_SUFFIX}"
            RELEASE_NAME="Sanctions ${VERSION} Snapshot (${TIMESTAMP})"
            PRERELEASE=true
          fi

          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "JAR name     : $JAR_NAME"
          echo "Tag          : $TAG"
          echo "Release name : $RELEASE_NAME"
          echo "Prerelease   : $PRERELEASE"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Locate and rename the built JAR
        id: artifact
        run: |
          BUILT_JAR=$(find target -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "original-*.jar" | head -n 1)

          if [ -z "$BUILT_JAR" ]; then
            echo "ERROR: No JAR found in target/"
            ls -la target/
            exit 1
          fi

          echo "Found built JAR: $BUILT_JAR"
          FINAL_NAME="${{ steps.naming.outputs.jar_name }}"
          cp "$BUILT_JAR" "$FINAL_NAME"
          echo "final_jar=$FINAL_NAME" >> $GITHUB_OUTPUT
          ls -lh "$FINAL_NAME"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.naming.outputs.tag }}"
          NAME="${{ steps.naming.outputs.release_name }}"
          JAR="${{ steps.artifact.outputs.final_jar }}"
          PRERELEASE="${{ steps.naming.outputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"

          NOTES=$(cat <<EOF
          Automated build of **Sanctions**

          - **Version:** \`${VERSION}\`
          - **Artifact:** \`${JAR}\`
          - **Commit:** ${SHA}
          - **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          )

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              --prerelease \
              "$JAR"
          else
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              "$JAR"
          fi

          echo "Release created successfully: $TAG"
