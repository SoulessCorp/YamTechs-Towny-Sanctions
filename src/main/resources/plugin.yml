name: YamTechSanctions
version: 1.1.1
main: yt.yamtechs.sanctions.SanctionsPlugin
api-version: '1.19'
description: Towny trade sanctions and AllyTeam diplomacy by YamTech.
author: YamTech
depend: [Towny]
commands:
  sanction:
    description: Issue, inspect, and lift Towny trade sanctions.
    usage: /sanction help
    aliases: [sanctions]
  allyteam:
    description: Create AllyTeams and vote on nation sanctions.
    usage: /allyteam help
    aliases: [ally]
permissions:
  sanction.admin:
    description: Manage all YamTech sanctions.
    default: op
  sanction.bypass:
    description: Bypass YamTech trade sanctions.
    default: op
